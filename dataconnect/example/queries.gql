mutation CreateUser @auth(level: USER) {
  user_insert(data: {
    username: "newuser",
    email: "newuser@example.com",
    createdAt_expr: "request.time",
    displayName: "New User"
  })
}

query ListPlaces @auth(level: PUBLIC, insecureReason: "This operation is safe to expose to the public") {
  places {
    id
    name
    latitude
    longitude
  }
}

mutation AddReview($placeId: UUID!, $rating: Int!, $reviewText: String!) @auth(level: USER) {
  review_insert(data: {
    placeId: $placeId,
    userId_expr: "auth.uid",
    createdAt_expr: "request.time",
    rating: $rating,
    reviewText: $reviewText
  })
}

query GetUserReviews @auth(level: USER) {
  reviews(where: {userId: {eq_expr: "auth.uid"}}) {
    id
    place {
      name
    }
    rating
    reviewText
  }
}